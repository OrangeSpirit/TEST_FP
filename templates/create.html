{% extends 'base.html' %}

{% block content %}
<h1>{% block title %} Create Joke {% endblock %}</h1>
<form method="post">
    <p>
        <label for="title">Topic</label>
        <input type="text" name="title" placeholder="Topic">
        </input>
    </p>

    <p>
        <label for="author">Author</label>
        <input type="text" name="author" placeholder="Author">
        </input>
    </p>

    <p>
        <label for="jokeText">Joke:</label>
        <br>
        <textarea name="jokeText" placeholder="You joke" rows="15" cols="60"></textarea>
    </p>
    <p>
        <button type="submit">Create</button>
    </p>
</form>
{% endblock %}
